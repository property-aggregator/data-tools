[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcn"
dynamic = ["version"]
description = "Exports transaction prices from the Polish Real Estate Price Register (RCN) and imports them into PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"requests>=2.31.0",
	"psycopg[binary]>=3.2.0",
]

[project.scripts]
rcn = "rcn.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "rcn.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rcn.resources" = ["*.csv"]
